name: Android Release APK

on:
  push:
    branches:
      - android

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/app/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
          pub-cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Prepare .env
        run: cp .env-prod .env

      - name: Generate env.g.dart
        run: dart run nylo_framework:main make:env

      - name: Configure Getui AppID
        run: |
          set -euo pipefail
          GETUI_APP_ID="$(grep -E '^GETUI_APP_ID=' .env | head -n1 | cut -d= -f2- | tr -d '"' | tr -d "'")"
          touch android/local.properties
          if grep -q '^getui.appid=' android/local.properties; then
            sed -i '/^getui.appid=/d' android/local.properties
          fi
          echo "getui.appid=${GETUI_APP_ID}" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch Flutter plugins remove jcenter
        run: |
          set -euo pipefail
          # getuiflut 等插件仍含 jcenter()，Gradle 9 会直接失败
          while IFS= read -r -d '' f; do
            if grep -q 'jcenter()' "$f"; then
              sed -i 's/jcenter()/mavenCentral()/g' "$f"
              echo "patched: $f"
            fi
          done < <(find "$HOME/.pub-cache" -path '*/android/build.gradle' -print0 2>/dev/null || true)

      - name: Build release APK
        id: build
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Upload APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: caibao-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
