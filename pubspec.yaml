# Nylo - Micro-framework for Flutter.
#
# Website: https://nylo.dev
# Official repository: https://github.com/nylo-core/nylo
# Author: Anthony Gordon <https://github.com/agordn52>

name: caibao
description: A new Flutter application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

workspace:
  - packages/caibao_theme
  - packages/hello_app
  - packages/todo_app

dependencies:
  google_fonts: ^8.2.1
  analyzer: ^13.0.0
  intl: ^0.20.3
  nylo_framework: ^7.1.26
  cupertino_icons: ^1.0.9
  font_awesome_flutter: ^11.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.2
  getuiflut: ^0.2.41
  flutter_bugly: ^1.1.1
  caibao_theme: any
  caibao_hello_app: any
  caibao_todo_app: any

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  cli_util: 0.5.2
  dbus: 0.7.14
  flutter_secure_storage_darwin: 0.4.0
  intl: 0.20.3
  package_config: 3.0.0

# APP ICON - public/app_icon/icon.png
# Build icons: "dart run flutter_launcher_icons"
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/icon.png"
  remove_alpha_ios: true

flutter:


  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/app_icon/
    - lang/
